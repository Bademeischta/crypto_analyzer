name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        engine: [lightgbm, hist_gb]
        exclude:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check src tests main.py
      - name: Tests (offline, synthetische Daten)
        env:
          CA_TEST_ENGINE: ${{ matrix.engine }}
        run: python -m pytest
